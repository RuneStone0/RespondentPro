name: Build & push Docker image

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    outputs:
      version_tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # needed to read existing release tags

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Compute next version
        id: version
        run: |
          git fetch --tags --quiet
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            base=$(node -p "require('./package.json').version")
            next="v${base}"
          else
            ver="${latest#v}"
            IFS='.' read -r major minor patch <<< "$ver"
            patch=$((patch + 1))
            next="v${major}.${minor}.${patch}"
          fi
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
          cache-from: |
            type=registry,ref=ghcr.io/runestone0/respondentpro:buildcache
            type=registry,ref=ghcr.io/runestone0/respondentpro:latest
          cache-to: type=registry,ref=ghcr.io/runestone0/respondentpro:buildcache,mode=max
          tags: |
            ghcr.io/runestone0/respondentpro:latest
            ghcr.io/runestone0/respondentpro:${{ steps.version.outputs.version }}

  create-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub releases

    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-and-push.outputs.version_tag }}
          name: ${{ needs.build-and-push.outputs.version_tag }}
          generate_release_notes: true
          body: |
            Docker image: `ghcr.io/runestone0/respondentpro:${{ needs.build-and-push.outputs.version }}`
            Also available as `ghcr.io/runestone0/respondentpro:latest`

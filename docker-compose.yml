services:
  respondentpro:
    image: ghcr.io/runestone0/respondentpro:latest
    container_name: respondentpro
    restart: unless-stopped
    ports:
      - "38471:38471"
    volumes:
      - respondentpro-data:/app/data
    environment:
      - NODE_ENV=production

volumes:
  respondentpro-data:

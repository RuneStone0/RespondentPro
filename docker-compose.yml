services:
  respondentpro:
    image: ghcr.io/runestone0/respondentpro:latest
    pull_policy: always   # re-pull when the stack is redeployed (does not poll GHCR by itself)
    container_name: respondentpro
    restart: unless-stopped
    ports:
      - "38471:38471"
    volumes:
      - respondentpro-data:/app/data
    environment:
      - NODE_ENV=production
      - DATA_STORE_MODE=mongodb
      # MONGODB_URI — set in Portainer env vars or host .env via env_file below
    env_file:
      - .env
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Auto-pull and recreate respondentpro when GHCR :latest changes.
  # Uses the maintained Watchtower fork (containrrr/watchtower was archived Dec 2025).
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup --label-enable
    # If ghcr.io/runestone0/respondentpro is private, the Docker host must already
    # be logged in to ghcr.io (Portainer registry config or `docker login ghcr.io`).

volumes:
  respondentpro-data:

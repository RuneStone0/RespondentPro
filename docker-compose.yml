services:
  respondentpro:
    build:
      context: .
      args:
        # Pass the current git SHA so /health can report it.
        # Override with: GIT_SHA=$(git rev-parse --short HEAD) docker compose build
        GIT_SHA: ${GIT_SHA:-unknown}
    image: respondentpro
    container_name: respondentpro
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - respondentpro-data:/app/data
    environment:
      - NODE_ENV=production

volumes:
  respondentpro-data:

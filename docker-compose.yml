services:
  respondentpro:
    image: ghcr.io/runestone0/respondentpro:latest
    container_name: respondentpro
    restart: unless-stopped
    ports:
      - "38471:38471"
    volumes:
      - respondentpro-data:/app/data
    environment:
      - NODE_ENV=production
      - DATA_STORE_MODE=mongodb
    # MONGODB_URI (and AI_* keys) — set in Portainer env vars or host .env via env_file:
    env_file:
      - .env

volumes:
  respondentpro-data:

services:
  respondentpro:
    image: ghcr.io/runestone0/respondentpro:latest
    pull_policy: always   # re-pull on every deploy; Portainer GitOps polling (5 min) drives the updates
    container_name: respondentpro
    restart: unless-stopped
    ports:
      - "38471:38471"
    volumes:
      - respondentpro-data:/app/data
    environment:
      - NODE_ENV=production
      - DATA_STORE_MODE=mongodb
      # MONGODB_URI — set as a Portainer stack env var; written to the checkout's .env at deploy time
    env_file:
      - .env

volumes:
  respondentpro-data:

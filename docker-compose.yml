services:
  respondentpro:
    image: ghcr.io/runestone0/respondentpro:latest
    pull_policy: always   # re-pull on every deploy; Portainer GitOps polling (5 min) drives the updates
    container_name: respondentpro
    restart: unless-stopped
    ports:
      - "38471:38471"
    volumes:
      - respondentpro-data:/app/data
    environment:
      - NODE_ENV=production
      - DATA_STORE_MODE=mongodb
      # MONGODB_URI — must be set as a Portainer stack environment variable
      # (Portainer interpolates ${...} from the stack's env vars; do NOT commit
      # the value to git — repo stacks never read a local .env file).
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI must be set in the Portainer stack environment}

volumes:
  respondentpro-data:
